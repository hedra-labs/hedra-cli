syntax = "proto3";

// Trimmed from the sandbox broker's protos at upstream commit
// 88fee67766faaeba2334b28aed1653990eebd049.
package hedra.sandbox.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_MANIFEST = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_UNAUTHENTICATED = 3;
  ERROR_CODE_PERMISSION_DENIED = 4;
  ERROR_CODE_NOT_FOUND = 5;
  ERROR_CODE_CONFLICT = 6;
  ERROR_CODE_SANDBOX_NOT_READY = 7;
  ERROR_CODE_RUNNER_NOT_ATTACHED = 8;
  ERROR_CODE_QUOTA_EXCEEDED = 9;
  ERROR_CODE_RATE_LIMITED = 10;
  ERROR_CODE_PAYLOAD_TOO_LARGE = 11;
  ERROR_CODE_SANDBOX_DISCONNECTED = 12;
  ERROR_CODE_POOL_UNAVAILABLE = 13;
  ERROR_CODE_TIMEOUT = 14;
  ERROR_CODE_CANCELLED = 15;
  ERROR_CODE_INTERNAL = 16;
  ERROR_CODE_BROKER_UNAVAILABLE = 17;
}
