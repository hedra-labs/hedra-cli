[package]
name = "hedra_cli_sandbox"
version = "0.1.0"
edition = "2021"
description = "The streaming client behind hedra-cli's sandbox commands"
license = "Apache-2.0"
# Never released on its own; cargo-dist ships only the hedra-cli binary.
publish = false

[lib]
doctest = false

[features]
# Test-only code, enabled only from a dev-dependency so a release build never
# compiles it: a local broker with its generated TLS material, and on Windows
# the console host the console tests run the binary on.
fake-broker = ["dep:http-body", "dep:rcgen", "dep:time"]

[dependencies]
bytes = "1"
crossterm = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = { version = "1", optional = true }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
rcgen = { version = "0.13", optional = true, default-features = false, features = ["crypto", "pem", "ring"] }
prost-types = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tempfile = "3"
time = { version = "0.3", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14"
tonic-types = "0.14"
tower = { version = "0.5", default-features = false }

# The broker's TLS trusts what the OS trusts on macOS and Windows, as the
# REST calls' native-tls does, so the two never disagree about a root.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rustls-platform-verifier = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[build-dependencies]
protox = "0.9"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
