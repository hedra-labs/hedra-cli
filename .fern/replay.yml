# Hand-owned Fern Replay config (.fernignore'd). Generation only ever reads it —
# the one code path that writes it is `fern replay bootstrap` with .fernignore
# migration, which the generate path never asks for. Companion to .fernignore,
# but the opposite lever:
#
#   .fernignore  — "generator, do not WRITE this file"        (freezes the file)
#   exclude here — "replay, do not RE-APPLY customizations"   (frees the file)
#
# Replay records every non-.fernignore'd commit since the last generation as a
# "customization" and replays it onto each new generation. Entries here tell it
# not to, so the listed files always land as pure generated output.
#
# Verified semantics, fern-api 5.95.1 — the version generate-sdks.yml actually
# ran on 2026-08-13 ("Installed Fern CLI version 5.95.1"), re-read from the
# published bundle at that exact version. It installs via fern-api/setup-fern-cli
# with version: latest and pins nothing, so this floats; re-read the applicator
# rather than trusting this note after a CLI bump.
#
#   - `exclude` suppresses patch APPLICATION, not detection.
#     ReplayApplicator.applyPatches() tests isExcluded(patch) at the top of the
#     loop and pushes {status:"skipped"} before any apply attempt, so an
#     excluded patch can never conflict or go "unresolved" ("Action required"
#     on a regeneration PR). Detection still records it in replay.lock's
#     `patches:` ledger — the entry just stays inert there.
#   - Entries are minimatch globs against repo-relative paths, read from THIS
#     file: LockManager.getCustomizationsConfig() YAML-parses
#     <outputDir>/.fern/replay.yml on every call and returns {} if it is absent.
#
# WHOLE-PATCH SEMANTICS: isExcluded() is `patch.files.some(f => ...)` — a patch
# is skipped ENTIRELY if ANY of its files matches. Keep version bumps in
# dedicated commits, or a mixed commit will drag real customizations into the
# skip along with the bump.
#
# That hazard used to block the src/sdk_executor.rs entry below, and no longer
# does: patch-d06b3c36 was recorded against two files, but the generator stopped
# emitting one of them, so only the half we want skipped is left. The entry
# carries the details.

exclude:
  # Machine-owned version stamps (ENG-10241).
  #
  # Every regeneration resets these two member manifests to the generator's own
  # defaults — hedra_sdk to 0.1.0, hedra_types to 0.0.0 — while the root crate
  # keeps the number `fern generate --version` stamped, because fern-config's
  # `packageIdentity` upserts into the ROOT [package] table and version is not
  # one of its keys. .github/scripts/set-version.py re-aligns the members from
  # the root afterwards; refresh-lockfile.yml carries the full rationale.
  #
  # That alignment commit is what Replay picked up as a customization —
  # patch-ed9886b4, from "ci: align the workspace crate versions on every
  # regeneration (#52)", whose entire diff is:
  #
  #     hedra-sdk/Cargo.toml     -version = "0.1.0"   +version = "1.0.0-dev"
  #     hedra-types/Cargo.toml   -version = "0.0.0"   +version = "1.0.0-dev"
  #
  # Replaying a version stamp is wrong in both directions:
  #
  #   - It re-stamps a stale number. refresh-lockfile.yml masks this today, but
  #     it only fires on `push: fern-bot/**`. release-sdks.yml (fern-config#44)
  #     regenerates and commits straight to main with no bot branch, so on a
  #     release regeneration the replayed "1.0.0-dev" is the last write — the
  #     `-dev` suffix the release exists to strip.
  #   - It will eventually conflict instead of applying. The patch context is
  #     the generator's own `version = "0.1.0"` / `"0.0.0"` lines; the day the
  #     generator emits anything else, the patch goes unresolved and the
  #     regeneration PR shows "Action required". hedra-python hit exactly this
  #     on pyproject.toml when a test regeneration stamped 1.1.0 (its PR #44).
  #
  # Do NOT "fix" this by .fernignore'ing the two manifests instead. That was
  # tried and rejected (ENG-10112 §2, PR #21, never merged): freezing them also
  # freezes real generated dependency changes, the ENG-10048 trap the Cargo.lock
  # entry in .fernignore documents. Excluding here leaves both files fully
  # generator-owned and only stops Replay putting yesterday's stamp back on top.
  #
  # Four paths, two layouts (ENG-10291). The recorded patch this exists to skip,
  # patch-ed9886b4, names hedra-sdk/Cargo.toml and hedra-types/Cargo.toml — the
  # paths are baked into the patch, so those two entries keep matching it after
  # the rename and must stay. The two below are for the patch that replaces it:
  # once release-sdks.yml has re-cut this branch, refresh-lockfile.yml's next
  # alignment commit is recorded against hedra-cli-sdk/Cargo.toml and
  # hedra-cli-types/Cargo.toml, and an exclude list naming only the old paths
  # would not match it — putting the stale stamp back exactly as described
  # above. Entries matching no patch are inert, so listing all four is safe on
  # either layout, the same reasoning .fernignore uses for the two custom.rs
  # paths. main has the same two-entry gap; it is harmless there because a
  # regeneration on main is not what strips a `-dev` suffix.
  - hedra-sdk/Cargo.toml
  - hedra-types/Cargo.toml
  - hedra-cli-sdk/Cargo.toml
  - hedra-cli-types/Cargo.toml

  # The ENG-10226 identity-header merge in CliExecutor::new (ENG-10241, and the
  # 2026-08-13 regenerations that forced the issue). Backported from main's #88;
  # the reasoning is branch-independent, only the incident numbers differ.
  #
  # src/sdk_executor.rs is generated, and the one deviation it carries from
  # generated output is machine-owned: .github/scripts/patch-sdk-headers.py
  # re-derives the merge and re-inserts it after every regeneration, naming the
  # SDK crate from the config.rs path it is handed. Replay replaying a *recorded*
  # copy of that same fixup is therefore never useful — and it is actively
  # harmful, because the recorded copy is frozen while the tree is not:
  #
  #     patch-d06b3c36 ("fix: re-supply the X-Fern-* identity headers the CLI
  #     executor drops (#57)") records the pre-ENG-10291 body, which calls
  #     `hedra_sdk::ClientConfig::default()`. The crate is `hedra_cli_sdk` now.
  #     Replay puts the old body back over the freshly generated file; the result
  #     is neither the generated nor the patched shape, so patch-sdk-headers.py
  #     refuses to guess and refresh-lockfile.yml aborts BEFORE the version
  #     alignment — which is why `rust` then also reports the member crates at
  #     0.1.0/0.0.0. This branch hit it on #85 and main hit it on #87; both
  #     needed the same hand fix pushed onto the bot branch.
  #
  # This cannot age out on its own. A regeneration rebases a patch's
  # `base_generation` and drops snapshots for files that no longer exist, but
  # `patch_content` is frozen at detection — verified by diffing .fern/replay.lock
  # across the #87 regeneration, where d06b3c36's body is byte-for-byte the #57
  # diff from 2026-08-10.
  #
  # One entry retires the whole patch: isExcluded() is `files.some(...)` and
  # d06b3c36's file list is [hedra-sdk/src/config.rs, src/sdk_executor.rs].
  # Nothing is lost with it. That was the objection when this was first raised
  # (the config.rs half carried a real X-Fern-SDK-Version fix), and the ENG-10291
  # rename settled it: the generator no longer emits hedra-sdk/src/config.rs, so
  # the regeneration that brought the rename dropped that hunk from
  # `patch_content` and the next one dropped its snapshot. What is left in the
  # patch is only the stale executor body. The X-Fern-SDK-Version literal is
  # still repaired every regeneration by patch-sdk-headers.py's first patch,
  # which is where it belongs.
  #
  # The entry also covers what comes next: the hand fix pushed onto a bot branch
  # to repair a regeneration reaches this branch under its own SHA (autoland
  # lands regeneration PRs with a merge commit now, #75) and Replay's commit
  # filter skips only fern-api[bot]'s own commits and `[fern-generated]` /
  # `[fern-replay]` subjects. So it is detected as a customization itself — a
  # one-line diff against a line that, with d06b3c36 skipped, no longer exists.
  # Its file list is [src/sdk_executor.rs], so this entry skips it too.
  - src/sdk_executor.rs

  # NOT excluded, deliberately: docs/superpowers/** (patch-d871322c, ~1.8k lines
  # of markdown in the ledger). Excluding it would be actively unsafe. Those
  # files are hand-written and the generator emits nothing under docs/, so
  # Replay re-adding them was the only thing keeping them in the tree; an
  # exclude here drops that without replacing it, which is precisely the #27 →
  # #29 sequence that deleted .gitattributes. .fernignore is the lever, and the
  # docs/ entry there is now in place — but it has NOT retired the patch, as
  # this note used to claim. The trailing slash defeats Replay's cleanse matcher
  # at 5.94.0; the docs/ entry in .fernignore carries the measurement.
