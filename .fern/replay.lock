                    "HTTP error 404: not found"
                );
                assert_eq!(
                    SdkError::Network("connection refused".into()).to_string(),
                    "network error: connection refused"
                );
                assert_eq!(
                    SdkError::Timeout("after 30s".into()).to_string(),
                    "request timeout: after 30s"
                );
                assert_eq!(
