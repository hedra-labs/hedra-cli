# ENG-10291: these are the post-rename crate directories, and they do not exist
# in this branch's tree yet. That is deliberate, not an oversight.
#
# This branch is a base for regeneration, not something built directly. The
# release is cut by re-dispatching fern-config's release-sdks.yml onto it with
# binary_names=cli=hedra-cli, and that generation moves hedra-sdk/ ->
# hedra-cli-sdk/ and hedra-types/ -> hedra-cli-types/. dist-workspace.toml is
# .fernignore'd, so the generation cannot repair this list itself — a member
# list naming the old directories is what makes `dist plan` fail on the release
# PR with "Failed to find Cargo.toml in an ancestor of .../hedra-types"
# (hedra-cli #81).
#
# Unlike .github/scripts/crate-layout.sh, a static member list cannot span both
# layouts, so it has to name one of them. It names the one the release will
# have. The cost is that `plan` stays red on this branch until that regeneration
# merges — which is also true of tests/wire_contract.rs, updated in the same
# commit for the same reason. On main the equivalent flip rode along inside the
# regeneration PR itself (#72); no one is hand-pushing into a release PR, which
# is the whole point of fixing it here.
[workspace]
members = ["cargo:.", "cargo:hedra-cli-types", "cargo:hedra-cli-sdk"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Build each app with `cargo build --package` instead of a workspace-wide
# build. Without this, cargo-dist also compiles the non-distributed root
# crate, whose default features pull in native-tls/OpenSSL and break the
# musl builds.
precise-builds = true
# Release binaries use the self-contained TLS backend so Linux musl targets
# do not require a cross-compiled OpenSSL installation. `dist plan` is blind to
# these two keys — the oracle is the `cargo build` argv `dist build` emits,
# which must carry `--no-default-features --features rustls`.
default-features = false
features = ["rustls"]
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Whether to enable GitHub Attestations
github-attestations = true
# Target-specific compiler setup applied before cargo-dist builds artifacts.
github-build-setup = "../build-setup.yml"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Publish stable npm releases after GitHub artifacts are available.
# The 2FA-gated first publish is done: `@hedra/cli` 0.2.0 went to npm on
# 2026-08-01, so the scope exists and CI can take over from here. The generated
# publish job authenticates with the `NPM_TOKEN` secret — no Trusted Publishing
# / OIDC job is needed, contrary to what this comment used to say.
#
# "homebrew" is deliberately absent, and this is interim. The generated
# `publish-homebrew-formula` job commits straight onto the tap's default branch,
# which is protected; ENG-10303 replaces it with a PR into the tap plus
# autoland on that side. npm is also the only channel where a backfilled 1.0.0
# stays installable — a tap serves exactly one version, whatever is at HEAD.
# `installers`, `tap` and `formula` below stay exactly as they are: the formula
# must keep being generated and attached to each GitHub Release. That artifact
# is what the tap is updated from by hand in the meantime, and what ENG-10303's
# mechanism takes as its input.
publish-jobs = ["npm"]
# Homebrew tap backing `brew install hedra-labs/tap/hedra-cli`.
tap = "hedra-labs/homebrew-tap"
# Keep package-manager names explicit: both install the `hedra` binary.
npm-package = "@hedra/cli"
formula = "hedra-cli"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[dist.github-action-commits]
"actions/checkout" = "v7"