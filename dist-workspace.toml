[workspace]
members = ["cargo:.", "cargo:hedra-cli-types", "cargo:hedra-cli-sdk"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Build each app with `cargo build --package` instead of a workspace-wide
# build. Without this, cargo-dist also compiles the non-distributed root
# crate, whose default features pull in native-tls/OpenSSL and break the
# musl builds.
precise-builds = true
# Release binaries use the self-contained TLS backend so Linux musl targets
# do not require a cross-compiled OpenSSL installation. `dist plan` is blind to
# these two keys — the oracle is the `cargo build` argv `dist build` emits,
# which must carry `--no-default-features --features rustls`.
default-features = false
features = ["rustls"]
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Whether to enable GitHub Attestations
github-attestations = true
# Target-specific compiler setup applied before cargo-dist builds artifacts.
github-build-setup = "../build-setup.yml"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Publish stable npm releases after GitHub artifacts are available.
# The 2FA-gated first publish is done: `@hedra/cli` 0.2.0 went to npm on
# 2026-08-01, so the scope exists and CI can take over from here. The generated
# publish job authenticates with the `NPM_TOKEN` secret.
#
# Homebrew is back, as `./publish-homebrew-pr` — a custom job, not the built-in
# "homebrew". #77 removed the built-in because it commits straight onto the tap's
# protected default branch; this is the ENG-10303 replacement it was waiting for,
# and it opens a pull request into the tap instead. hedra-labs/homebrew-tap's
# autoland-formula.yml lands that PR.
#
# Naming the custom workflow here rather than hand-patching the generated
# release.yml is what makes the fix survive `dist init` and a cargo-dist bump;
# see the header of .github/workflows/publish-homebrew-pr.yml, and the guard in
# .github/scripts/check-homebrew-publish.py that keeps it that way.
#
# `installers`, `tap` and `formula` below still stay exactly as they are, for the
# reason #77 gave: the formula must keep being generated and attached to each
# GitHub Release. `installers` and `publish-jobs` are independent settings, so
# that held while the publisher was off and holds now that it is back — and that
# artifact remains the by-hand fallback if this automation is ever down.
publish-jobs = ["./publish-homebrew-pr", "npm"]
# Homebrew tap backing `brew install hedra-labs/tap/hedra-cli`.
tap = "hedra-labs/homebrew-tap"
# Keep package-manager names explicit: both install the `hedra-cli` binary.
npm-package = "@hedra/cli"
formula = "hedra-cli"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[dist.github-action-commits]
"actions/checkout" = "v7"