# Repair a fern-bot regeneration branch so it can land green: align the
# workspace crate versions (ENG-10219), re-apply the SDK header patches
# (ENG-10226), then refresh Cargo.lock (ENG-10202). All fixes go out in ONE
# commit — see "Gating" below for why that is not negotiable.
#
# --- SDK header patches ---
#
# Regeneration resets hedra-sdk/src/config.rs to an X-Fern-SDK-Version of
# "0.1.0" and emits a CliExecutor that drops the SDK's X-Fern-* identity
# headers. Neither file can be .fernignore'd (both must keep receiving real
# generator changes), so patch-sdk-headers.py re-applies both fixes after
# every regeneration — the same design as the version aligner. The script's
# docstring carries the full rationale, the patch anchors, and the removal
# condition (delete the step when ENG-10234 lands upstream).
#
# --- Cargo.lock ---
#
# Cargo.toml and hedra-sdk/Cargo.toml are generator-owned, but Cargo.lock is
# hand-owned (.fernignore'd — see the comment on that entry). Two kinds of
# regeneration therefore leave the lockfile stale and turn ci.yml's
# `cargo check --locked` red: a root [package].version bump, and a dependency
# change in a generated manifest. This workflow re-syncs the lockfile minimally
# (`cargo fetch` keeps every pin that still satisfies the manifests) and pushes
# the fix onto the bot branch.
#
# --- Version alignment ---
#
# The three crates dist-workspace.toml lists as members are supposed to share a
# version, but the generator has no way to keep them that way: fern-config's
# `packageIdentity` upserts seven keys inside the *root* [package] table and
# version is not one of them, and `fern generate --version` stamps the root
# crate alone. So every regeneration resets hedra-sdk to 0.1.0 and hedra-types
# to 0.0.0 while the root keeps its real version, and only a post-generation
# fixup can repair it.
#
# Fencing the two member manifests in .fernignore instead was tried and
# rejected (ENG-10112 §2, PR #21, never merged): it would freeze real
# dependency changes, which is the ENG-10048 trap the Cargo.lock entry already
# documents. The alignment is inert for resolution — neither path dependency
# carries a version requirement — so it cannot change what gets built.
#
# Running the aligner here, before the staleness gate, is what makes it run
# "before rust": the push re-fires the PR's required `rust` check against an
# already-aligned tree.
#
# --- Gating ---
#
# Alignment and the lockfile refresh must land in one commit. Aligning the
# members invalidates `--locked`, so an intermediate commit carrying aligned
# manifests and an unrefreshed lock is precisely the state where
# `cargo check --locked` is red. That also rules out doing this in a second
# workflow: two workflows pushing the same bot branch race and re-fire each
# other.
#
# The gates are deliberately NOT all `stale`. Gating the commit on staleness
# deadlocks in the case that becomes the most common one once alignment has
# landed once. Steady state: main is aligned, so the .fernignore'd Cargo.lock
# already records the aligned versions and regeneration resets only the
# manifests. The aligner then *restores* lock/manifest agreement:
#
#   post-regen (members reset, lock still aligned):   stale would be true
#   after the aligner has run:                        stale is false
#
# A commit step gated on `stale` is therefore skipped, both manifest edits are
# discarded, and the branch stays misaligned and red on every re-run, forever.
# So the gates are split:
#
#   stale          gates `cargo fetch` and nothing else
#   a dirty tree   gates the commit, the push, and the CI re-trigger
#   unconditional  the pre-push `cargo metadata --locked` check, which is what
#                  catches "aligned manifests, unrefreshed lock" before it can
#                  be pushed. It subsumes the old "stale but `cargo fetch`
#                  changed nothing" error, since dirtiness can now come from
#                  alignment rather than from the refresh.
#
# Idempotence: the aligner rewrites nothing when the versions already agree and
# `cargo fetch` changes nothing when the lockfile is in sync, so a re-run
# leaves the worktree clean, the commit is skipped, and the refresh commit's
# own push (which re-fires this workflow) terminates the loop.
#
# Not covered here: release-sdks.yml (fern-config#44) regenerates and commits
# straight to main with no bot branch, so this workflow never fires and a
# release commit lands with the members at 0.1.0/0.0.0. Harmless — cargo-dist
# reads the root crate's version alone — and the next regeneration PR
# re-aligns. ci.yml's alignment step warns rather than fails off pull_request
# so that commit does not leave main red in the meantime.
#
# Force-push race: the Fern app force-pushes regeneration branches, which can
# drop a refresh commit — but that push re-fires this workflow, which re-adds
# it. We check out the branch head (not github.sha) so a mid-run force-push
# fails our push instead of resurrecting a stale tree; the force-push's own run
# then fixes the branch.
#
# CI re-trigger: pushes made with the default GITHUB_TOKEN do NOT fire other
# workflows, so the refreshed commit would sit unchecked and the PR's required
# `rust` check unsatisfied. The push identity is a chain, best available first
# (ENG-10210):
#   1. GitHub App installation token, minted at runtime from the repo variable
#      SDK_BOT_APP_CLIENT_ID plus the repo secret SDK_BOT_APP_PRIVATE_KEY (an
#      org-owned app with contents: read/write and pull-requests: write,
#      installed on this repo -- shared with autoland-regen.yml). App-token
#      pushes re-trigger ci.yml's pull_request run natively.
#   2. LOCKFILE_REFRESH_TOKEN, a fine-grained PAT with contents: read/write on
#      this repo — same native re-trigger, but a personal credential.
#   3. GITHUB_TOKEN, whose push fires no workflows: the last step then
#      explicitly dispatches ci.yml on the branch (workflow_dispatch is exempt
#      from the no-retrigger rule). That run validates the commit but cannot
#      satisfy the PR's required `rust` check, so a human must approve the
#      parked pull_request runs.

name: Refresh lockfile

on:
  push:
    branches:
      - "fern-bot/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: app-token
        if: vars.SDK_BOT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SDK_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_APP_PRIVATE_KEY }}

      - name: Checkout branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token || secrets.LOCKFILE_REFRESH_TOKEN || github.token }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # Must precede the staleness check: aligning the members is itself one of
      # the things that can invalidate the lockfile, and the refresh below has
      # to see the aligned tree.
      - name: Align the member crate versions with the root
        run: |
          . .github/scripts/crate-layout.sh
          version="$(python3 .github/scripts/set-version.py --read Cargo.toml)"
          echo "Root crate is at $version."
          python3 .github/scripts/set-version.py "$version" \
            "$SDK_DIR/Cargo.toml" "$TYPES_DIR/Cargo.toml"

      # Source-only, so it cannot invalidate the lockfile; grouped with the
      # aligner so every tree fix precedes the staleness gate and the commit.
      - name: Re-apply the SDK header patches
        run: |
          . .github/scripts/crate-layout.sh
          version="$(python3 .github/scripts/set-version.py --read Cargo.toml)"
          python3 .github/scripts/patch-sdk-headers.py "$version" \
            "$SDK_DIR/src/config.rs" src/sdk_executor.rs

      - name: Check whether Cargo.lock is stale
        id: staleness
        run: |
          if cargo metadata --locked --format-version 1 > /dev/null 2> "$RUNNER_TEMP/stale.err"; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock is in sync with the manifests; no refresh needed."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/stale.err"
          fi

      - name: Refresh Cargo.lock
        if: steps.staleness.outputs.stale == 'true'
        run: cargo fetch

      # Unconditional on purpose: this is the gate that stops a commit with
      # aligned manifests and an unrefreshed lockfile from ever being pushed.
      - name: Verify the lockfile resolves
        run: |
          if cargo metadata --locked --format-version 1 > /dev/null 2> "$RUNNER_TEMP/verify.err"; then
            echo "Cargo.lock resolves against the manifests."
            exit 0
          fi
          cat "$RUNNER_TEMP/verify.err"
          echo "::error::Cargo.lock still does not resolve after alignment and 'cargo fetch' — this is staleness the refresh cannot fix; see the log above."
          exit 1

      - name: Look for pending fixes
        id: pending
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            git status --porcelain
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
            echo "Versions aligned and Cargo.lock in sync; nothing to commit."
          fi

      - name: Commit and push the fixes
        if: steps.pending.outputs.dirty == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          . .github/scripts/crate-layout.sh
          # A set check, not a string compare: up to five files can legitimately
          # be dirty now, in any combination.
          #
          # The allowlist and the message it prints are built from one list, so
          # they cannot drift apart. That matters more than it looks: the two
          # used to name the crate paths independently, and a mechanical rename
          # that updated the message but not the regex — or vice versa — would
          # leave a guard that either passes on ANYTHING or rejects everything,
          # while still reading correctly in review. Widening this to `.*` is
          # strictly worse than the loud failure it replaces.
          allowed=(Cargo.lock "$SDK_DIR/Cargo.toml" "$TYPES_DIR/Cargo.toml" "$SDK_DIR/src/config.rs" src/sdk_executor.rs)
          # Escape the dots so `config.rs` cannot also match `configXrs`; the
          # crate directory names themselves carry no regex metacharacters.
          escaped="$(printf '%s\n' "${allowed[@]}" | sed 's/\./\\./g' | paste -sd '|' -)"
          pattern="^ M ($escaped)\$"
          unexpected="$(git status --porcelain | grep -vE "$pattern" || true)"
          if [ -n "$unexpected" ]; then
            printf -v joined '%s, ' "${allowed[@]}"
            echo "::error::Refresh touched something outside {${joined%, }} — refusing to commit."
            git status --porcelain
            exit 1
          fi
          git add "${allowed[@]}"
          # Name only what actually changed; the three fix groups occur in any
          # combination.
          parts=""
          if ! git diff --cached --quiet -- "$SDK_DIR/Cargo.toml" "$TYPES_DIR/Cargo.toml"; then
            parts="align workspace crate versions"
          fi
          if ! git diff --cached --quiet -- "$SDK_DIR/src/config.rs" src/sdk_executor.rs; then
            parts="${parts:+$parts and }re-apply the SDK header patches"
          fi
          if ! git diff --cached --quiet -- Cargo.lock; then
            parts="${parts:+$parts and }refresh Cargo.lock"
          fi
          message="build: $parts after regeneration"
          # Attribute the commit to whichever identity is doing the push.
          if [ -n "$APP_SLUG" ]; then
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "$(gh api "/users/${APP_SLUG}[bot]" --jq .id)+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git commit -m "$message"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Re-trigger CI when pushed with the fallback token
        if: steps.pending.outputs.dirty == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REFRESH_TOKEN: ${{ secrets.LOCKFILE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "Pushed with the app installation token; the push itself re-triggers ci.yml."
            exit 0
          fi
          if [ -n "$REFRESH_TOKEN" ]; then
            echo "Pushed with LOCKFILE_REFRESH_TOKEN; the push itself re-triggers ci.yml."
            exit 0
          fi
          echo "::warning::Neither the app credentials nor LOCKFILE_REFRESH_TOKEN is configured; pushed with GITHUB_TOKEN, which fires no workflows. Dispatching ci.yml on ${{ github.ref_name }} instead."
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
