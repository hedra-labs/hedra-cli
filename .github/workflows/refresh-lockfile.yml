# Auto-refresh Cargo.lock on fern-bot regeneration branches (ENG-10202).
#
# Cargo.toml and hedra-sdk/Cargo.toml are generator-owned, but Cargo.lock is
# hand-owned (.fernignore'd — see the comment on that entry). Two kinds of
# regeneration therefore leave the lockfile stale and turn ci.yml's
# `cargo check --locked` red: a root [package].version bump, and a dependency
# change in a generated manifest. This workflow re-syncs the lockfile minimally
# (`cargo fetch` keeps every pin that still satisfies the manifests) and pushes
# the fix onto the bot branch as a Cargo.lock-only commit.
#
# Idempotence: the run gates on `cargo metadata --locked` and exits without
# committing when the lockfile is already in sync, so the refresh commit's own
# push (which re-fires this workflow) terminates the loop.
#
# Force-push race: the Fern app force-pushes regeneration branches, which can
# drop a refresh commit — but that push re-fires this workflow, which re-adds
# it. We check out the branch head (not github.sha) so a mid-run force-push
# fails our push instead of resurrecting a stale tree; the force-push's own run
# then fixes the branch.
#
# CI re-trigger: pushes made with the default GITHUB_TOKEN do NOT fire other
# workflows, so the refreshed commit would sit unchecked. Configure the repo
# secret LOCKFILE_REFRESH_TOKEN (fine-grained PAT or GitHub App token with
# contents: read/write on this repo) and the push re-triggers ci.yml's
# pull_request run by itself. Until that secret exists the workflow falls back
# to GITHUB_TOKEN and explicitly dispatches ci.yml on the branch instead
# (workflow_dispatch is exempt from the GITHUB_TOKEN no-retrigger rule).

name: Refresh lockfile

on:
  push:
    branches:
      - "fern-bot/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.LOCKFILE_REFRESH_TOKEN || github.token }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check whether Cargo.lock is stale
        id: staleness
        run: |
          if cargo metadata --locked --format-version 1 > /dev/null 2> "$RUNNER_TEMP/stale.err"; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock is in sync with the manifests; nothing to do."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/stale.err"
          fi

      - name: Refresh Cargo.lock
        if: steps.staleness.outputs.stale == 'true'
        run: cargo fetch

      - name: Commit and push (Cargo.lock only)
        if: steps.staleness.outputs.stale == 'true'
        run: |
          status="$(git status --porcelain)"
          if [ -z "$status" ]; then
            echo "::error::Cargo.lock is stale but 'cargo fetch' changed nothing — this is staleness the refresh cannot fix; see the log above."
            exit 1
          fi
          if [ "$status" != " M Cargo.lock" ]; then
            echo "::error::Refresh touched more than Cargo.lock — refusing to commit."
            git status --porcelain
            exit 1
          fi
          # The refreshed lockfile must fully resolve before we push it.
          cargo metadata --locked --format-version 1 > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh Cargo.lock after regeneration"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Re-trigger CI when pushed with the fallback token
        if: steps.staleness.outputs.stale == 'true'
        env:
          REFRESH_TOKEN: ${{ secrets.LOCKFILE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$REFRESH_TOKEN" ]; then
            echo "Pushed with LOCKFILE_REFRESH_TOKEN; the push itself re-triggers ci.yml."
            exit 0
          fi
          echo "::warning::LOCKFILE_REFRESH_TOKEN is not configured; pushed with GITHUB_TOKEN, which fires no workflows. Dispatching ci.yml on ${{ github.ref_name }} instead."
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
