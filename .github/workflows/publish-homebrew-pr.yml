name: Publish the Homebrew formula by pull request

# Replaces cargo-dist's built-in `homebrew` publish job (ENG-10303).
#
# The built-in job checks the tap out and ends in a bare `git push`. That cannot
# work. hedra-labs/homebrew-tap's `main` carries the org ruleset "Protect
# default branches" — deletion, non_fast_forward, and pull_request with
# required_approving_review_count: 1 — whose only bypass actor is
# OrganizationAdmin. A push from any non-admin token returns HTTP 422. The one
# successful push in the tap's history (`hedra-cli 0.2.0`, 2026-08-01 21:56Z)
# landed fourteen minutes before the ruleset did, so the mechanism has never
# once run against the rules in force today.
#
# So: commit the formula onto a branch and open a pull request instead. Landing
# it is the tap's own `autoland-formula.yml`, which approves and merges PRs from
# this identity that touch nothing but `Formula/*.rb`. The PR is opened as
# `secrets.HOMEBREW_TAP_TOKEN` and approved there as hedra-sdk-ci-app[bot];
# see the IDENTITY comment on the checkout step for why round that way.
#
# A side benefit worth stating: the tap's `ruby -c Formula/*.rb` CI runs only on
# `pull_request`, so every formula published by the old direct-push path went in
# unchecked. Publishing by PR is the first time that check sees a release.
#
# WHY THIS FILE EXISTS AT ALL, rather than a patch to release.yml: release.yml is
# generated by cargo-dist, and a hand-patch there survives fern regeneration
# (`.github/` is .fernignore'd) and today's CI, but `dist init` or a cargo-dist
# bump reverts it silently — restoring a push that 422s. `publish-jobs` accepts
# a custom reusable workflow (`["./publish-homebrew-pr"]`, a supported hook
# since cargo-dist 0.3.0), so the publish logic lives in a file dist does not
# own. `.github/scripts/check-homebrew-publish.py` guards the wiring.
#
# `installers` still lists "homebrew", so dist keeps building `hedra-cli.rb` and
# attaching it to the GitHub Release: `installers` and `publish-jobs` are
# independent settings, and dropping the built-in publisher costs no artifact.
# That artifact is also the manual fallback — the PR's content is reproducible
# by hand from any release if this automation is ever down.

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  homebrew-pr:
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ inputs.plan }}
      TAP: hedra-labs/homebrew-tap
    steps:
      # IDENTITY. This opens the PR as `secrets.HOMEBREW_TAP_TOKEN`, and the tap
      # approves it as hedra-sdk-ci-app[bot]. #80 had those two the other way
      # round — the App here, the tap's own GITHUB_TOKEN approving — which
      # cannot work: the hedra-labs org disallows Actions creating or approving
      # pull requests, so a GITHUB_TOKEN approval is refused
      # ("The organization does not allow GitHub Actions to create or approve
      # pull requests", HTTP 409 even when *enabling* the repo-level setting).
      # Both sibling autolands already avoid that trap by approving with an App
      # token — hedra-cli's own autoland-regen.yml (fern-api[bot] authors,
      # hedra-sdk-ci-app approves) and deployments' deploy-pr-approve.yml
      # (recorder authors, auto-approver approves). This now matches them:
      # a non-App author, an App approver.
      #
      # GitHub refuses self-approval, so the App cannot hold both roles, and
      # approving is where it is worth more — an App token there needs no
      # org-wide policy change. The cost is that the tap's autoland gate is a
      # human's account ID (13316262, the pusher of the 0.2.0 commit) rather
      # than a bot's. That gate is narrowed by branch prefix and file pattern,
      # so what it grants is "PRs from that account, on formula/**, touching
      # only Formula/*.rb" — not that account's pull requests at large.
      #
      # Note this token is a long-lived PAT: if it is rotated or its owner
      # leaves, releases stop opening tap PRs, and the tap's gate has to be
      # repointed at the new account ID.
      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: hedra-labs/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true

      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true

      - name: Commit the formulae onto a branch
        id: commit
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          # Name the automation, not the token's owner. Whoever
          # HOMEBREW_TAP_TOKEN belongs to is the *pusher* either way — that is
          # what the tap's autoland gates on — but the commit should read as a
          # release artifact, the way the tap's history already does. A static
          # identity, like the generated job's "axo bot"; no lookup to get wrong.
          git config user.name "hedra-cli release"
          git config user.email "noreply@hedra.com"

          tag="$(jq --raw-output '.announcement_tag' <<<"$PLAN")"
          branch="formula/${tag}"
          git checkout -B "$branch"

          # Same PATH and the same `brew style` invocation the built-in job ran;
          # hoisted out of the loop because neither depends on the release.
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          brew update

          # This is extra complex because you can make your Formula name not match your app name
          # so we need to find releases with a *.rb file, and publish with that filename.
          titles=()
          for release in $(jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)' <<<"$PLAN"); do
            filename="$(jq --raw-output '.artifacts[] | select(endswith(".rb"))' <<<"$release")"
            name="${filename%.rb}"
            version="$(jq --raw-output .app_version <<<"$release")"

            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            # Re-running publish for an already-landed release re-downloads a
            # byte-identical formula. Skipping the commit is what keeps that
            # re-run from opening a pull request with an empty diff.
            if git diff --cached --quiet -- "Formula/${filename}"; then
              echo "Formula/${filename} is already current on the tap."
              continue
            fi
            git commit -m "${name} ${version}"
            titles+=("${name} ${version}")
          done

          if [[ "${#titles[@]}" -eq 0 ]]; then
            echo "Nothing to publish: no formula in this release differs from the tap."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One formula is the normal case, and reusing its commit subject keeps
          # the tap's history reading `hedra-cli 0.2.0` as it does today.
          if [[ "${#titles[@]}" -eq 1 ]]; then
            title="${titles[0]}"
          else
            title="Formula updates for ${tag}"
          fi

          {
            echo "publish=true"
            echo "branch=${branch}"
            echo "title=${title}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

          # Nothing but this job writes under `formula/**`, and a retried publish
          # must not be blocked by a half-finished predecessor's branch.
          git push --force origin "HEAD:${branch}"

      - name: Open the tap pull request
        if: steps.commit.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TITLE: ${{ steps.commit.outputs.title }}
          TAG: ${{ steps.commit.outputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.commit.outputs.tag }}
        run: |
          set -euo pipefail

          body="${RUNNER_TEMP}/tap-pr-body.md"
          cat > "$body" <<EOF
          Automated Homebrew publish for [\`${TAG}\`](${RELEASE_URL}).

          Opened by \`${SOURCE_REPO}\`'s release workflow ([run](${RUN_URL})) in place of the direct
          push cargo-dist generates, which cannot land on a branch that requires a pull request.

          The same \`.rb\` file is attached to the GitHub Release as an artifact, so this change is
          reproducible by hand if the automation is ever down.
          EOF

          existing="$(gh pr list --repo "$TAP" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$TAP" --title "$TITLE" --body-file "$body"
            url="$(gh pr view "$existing" --repo "$TAP" --json url --jq .url)"
            echo "Updated the open tap pull request."
          else
            url="$(gh pr create --repo "$TAP" --base main --head "$BRANCH" --title "$TITLE" --body-file "$body")"
            echo "Opened a tap pull request."
          fi

          echo "Homebrew formula: ${url}" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
