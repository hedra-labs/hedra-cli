name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Lets refresh-lockfile.yml re-run CI on a fern-bot branch after it pushes a
  # Cargo.lock refresh with the default GITHUB_TOKEN, whose pushes fire no
  # workflows on their own (ENG-10202).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-A warnings"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # Backstop for the regeneration path refresh-lockfile.yml cannot see: it
      # only fires on fern-bot/** branches, so a hand-made PR from someone
      # running `fern generate` locally would otherwise reach `cargo check`
      # with hedra-sdk at 0.1.0 and hedra-types at 0.0.0 (ENG-10219). A step
      # inside the already-required `rust` job rather than a job of its own, so
      # it needs no branch-protection change.
      #
      # Advisory off pull_request: release-sdks.yml commits a regenerated tree
      # straight to main, where the members do land misaligned until the next
      # regeneration PR re-aligns them. That is harmless (cargo-dist reads the
      # root crate's version alone) and must not leave main red.
      - name: Check the workspace crate versions are aligned
        run: |
          version="$(python3 .github/scripts/set-version.py --read Cargo.toml)"
          if python3 .github/scripts/set-version.py --check "$version" \
              hedra-sdk/Cargo.toml hedra-types/Cargo.toml; then
            exit 0
          fi
          hint="run: python3 .github/scripts/set-version.py \"\$(python3 .github/scripts/set-version.py --read Cargo.toml)\" hedra-sdk/Cargo.toml hedra-types/Cargo.toml && cargo fetch"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::Workspace crate versions are not aligned with the root ($version) — $hint"
            exit 1
          fi
          echo "::warning::Workspace crate versions are not aligned with the root ($version) — $hint"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check default features
        run: cargo check --locked --all-targets

      - name: Check release TLS feature set
        run: cargo check --locked --all-targets --no-default-features --features rustls

      - name: Test
        run: cargo test --locked

  # Contract for what a fern-api[bot] regeneration may change. Required status
  # check; autoland-regen.yml will not merge a PR without it. Always runs and
  # no-ops off fern-bot/ branches so it stays satisfiable on human PRs.
  #
  # hedra-cli has no version rule: both places the version surfaces
  # (src/http.rs, src/app.rs) read env!("CARGO_PKG_VERSION"), so manifest-vs-
  # runtime drift is structurally impossible here. Cargo.toml/Cargo.lock
  # agreement is already enforced by `cargo check --locked` in the rust job.
  regen-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate regeneration diff shape
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" != "pull_request" ]]; then
            echo "Not a pull_request event — nothing to check."
            exit 0
          fi
          if [[ "$HEAD_REF" != fern-bot/* ]]; then
            echo "Branch '$HEAD_REF' is not under fern-bot/ — shape check skipped."
            exit 0
          fi

          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          echo "Changed files (${#changed[@]}):"
          printf '  %s\n' "${changed[@]}"

          fail=0
          for f in "${changed[@]}"; do
            case "$f" in
              .github/*)
                echo "FAIL: regeneration must not touch .github/ ($f)"; fail=1 ;;
              .fernignore)
                echo "FAIL: regeneration must not edit .fernignore"; fail=1 ;;
            esac
          done
          [[ "$fail" -eq 0 ]]

          echo "OK: regeneration shape check passed."
