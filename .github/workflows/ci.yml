name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Lets refresh-lockfile.yml re-run CI on a fern-bot branch after it pushes a
  # Cargo.lock refresh with the default GITHUB_TOKEN, whose pushes fire no
  # workflows on their own (ENG-10202).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-A warnings"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Backstop for the regeneration path refresh-lockfile.yml cannot see: it
      # only fires on fern-bot/** branches, so a hand-made PR from someone
      # running `fern generate` locally would otherwise reach `cargo check`
      # with hedra-sdk at 0.1.0 and hedra-types at 0.0.0 (ENG-10219). A step
      # inside the already-required `rust` job rather than a job of its own, so
      # it needs no branch-protection change.
      #
      # Advisory off pull_request: release-sdks.yml commits a regenerated tree
      # straight to main, where the members do land misaligned until the next
      # regeneration PR re-aligns them. That is harmless (cargo-dist reads the
      # root crate's version alone) and must not leave main red.
      - name: Check the workspace crate versions are aligned
        run: |
          . .github/scripts/crate-layout.sh
          version="$(python3 .github/scripts/set-version.py --read Cargo.toml)"
          if python3 .github/scripts/set-version.py --check "$version" \
              "$SDK_DIR/Cargo.toml" "$TYPES_DIR/Cargo.toml"; then
            exit 0
          fi
          hint="run: python3 .github/scripts/set-version.py \"\$(python3 .github/scripts/set-version.py --read Cargo.toml)\" $SDK_DIR/Cargo.toml $TYPES_DIR/Cargo.toml && cargo fetch"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::Workspace crate versions are not aligned with the root ($version) — $hint"
            exit 1
          fi
          echo "::warning::Workspace crate versions are not aligned with the root ($version) — $hint"

      # Same backstop, for the header patches: refresh-lockfile.yml only fires
      # on fern-bot/** branches, so a hand-made regeneration PR would otherwise
      # reach the Test step with the X-Fern-* headers dropped and fail
      # tests/wire_contract.rs with a far less legible message.
      #
      # Advisory off pull_request for the same release-sdks.yml reason as
      # above — though on such a tree the Test step goes red regardless; this
      # step's job is the diagnosis, not the gate. Delete it together with
      # patch-sdk-headers.py when ENG-10234 lands upstream.
      - name: Check the SDK header patches are applied
        run: |
          . .github/scripts/crate-layout.sh
          version="$(python3 .github/scripts/set-version.py --read Cargo.toml)"
          if python3 .github/scripts/patch-sdk-headers.py --check "$version" \
              "$SDK_DIR/src/config.rs" src/http.rs src/sdk_executor.rs; then
            exit 0
          fi
          hint="run: python3 .github/scripts/patch-sdk-headers.py \"\$(python3 .github/scripts/set-version.py --read Cargo.toml)\" $SDK_DIR/src/config.rs src/http.rs src/sdk_executor.rs"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::The SDK header patches are not applied — $hint"
            exit 1
          fi
          echo "::warning::The SDK header patches are not applied — $hint"

      # Anti-revert guard for ENG-10303. The Homebrew publish path opens a PR
      # into the tap because the tap's main requires one; the built-in cargo-dist
      # job pushes instead, and `dist init` or a cargo-dist bump would restore it
      # from dist-workspace.toml without anyone touching a workflow. Fern
      # regeneration will not do it (.github/ is .fernignore'd) and no job here
      # runs `dist generate --check`, so this is the only thing that would notice.
      #
      # A step in the already-required `rust` job rather than a job of its own,
      # so it needs no branch-protection change — same reasoning as the two
      # above. A hard error on every event, unlike them: this is a static
      # property of committed files, and release-sdks.yml's direct-to-main
      # commits cannot perturb it.
      #
      # The guard reads workflow structure, not text, so it needs a YAML parser.
      # PyYAML is not a documented part of the runner image but is usually
      # present; installing it conditionally keeps the common path offline.
      - name: Check the Homebrew publish path opens a pull request
        run: |
          python3 -c "import yaml" 2>/dev/null ||
            python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyyaml
          python3 .github/scripts/check-homebrew-publish.py

      # Every script in .github/scripts shares one failure mode: going quiet.
      # A guard whose rules stop matching, or a patcher whose anchors stop
      # firing, passes forever on a tree it no longer protects — so their tests
      # run here, unfiltered.
      #
      # Unfiltered is the point (ENG-10310). This step used to pass
      # -p 'test_check_homebrew_publish.py', so test_patch_sdk_headers.py had
      # never run in CI: it sat 18-errors red on main — its fixtures predated
      # sdk_crate() and passed flat temp paths — through the three days
      # patch-sdk-headers.py was being repaired by hand. The tests for the
      # mechanism that survives regeneration must themselves run.
      #
      # Keep this after the Homebrew step: test_check_homebrew_publish.py needs
      # PyYAML, which that step installs when the runner image lacks it.
      - name: Test the CI scripts
        run: python3 -m unittest discover -s .github/scripts -v

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check default features
        run: cargo check --locked --all-targets

      - name: Check release TLS feature set
        run: cargo check --locked --all-targets --no-default-features --features rustls

      - name: Test
        run: cargo test --locked

  # Contract for what a fern-api[bot] regeneration may change. Required status
  # check; autoland-regen.yml will not merge a PR without it. Always runs and
  # no-ops off fern-bot/ branches so it stays satisfiable on human PRs.
  #
  # hedra-cli has no version rule: both places the version surfaces
  # (src/http.rs, src/app.rs) read env!("CARGO_PKG_VERSION"), so manifest-vs-
  # runtime drift is structurally impossible here. Cargo.toml/Cargo.lock
  # agreement is already enforced by `cargo check --locked` in the rust job.
  regen-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate regeneration diff shape
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" != "pull_request" ]]; then
            echo "Not a pull_request event — nothing to check."
            exit 0
          fi
          if [[ "$HEAD_REF" != fern-bot/* ]]; then
            echo "Branch '$HEAD_REF' is not under fern-bot/ — shape check skipped."
            exit 0
          fi

          git fetch --no-tags origin main
          base="$(git merge-base origin/main HEAD)"
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          echo "Changed files (${#changed[@]}):"
          printf '  %s\n' "${changed[@]}"

          fail=0
          for f in "${changed[@]}"; do
            case "$f" in
              .github/*)
                echo "FAIL: regeneration must not touch .github/ ($f)"; fail=1 ;;
              .fernignore)
                echo "FAIL: regeneration must not edit .fernignore"; fail=1 ;;
            esac
          done
          [[ "$fail" -eq 0 ]]

          echo "OK: regeneration shape check passed."
